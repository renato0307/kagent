{{- if not .Values.rbac.clusterScoped }}
{{- /* When running with namespace-scoped RBAC, the controller still needs
       cluster-scope read access to Namespace objects (e.g., for OIDC proxy
       annotation lookups). This minimal ClusterRole grants only that. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kagent.fullname" . }}-namespace-reader
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kagent.fullname" . }}-namespace-reader
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kagent.fullname" . }}-namespace-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "kagent.fullname" . }}-controller
    namespace: {{ include "kagent.namespace" . }}
{{- end }}
